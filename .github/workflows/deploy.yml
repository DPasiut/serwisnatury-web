name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Served under https://dpasiut.github.io/serwisnatury-web/ until a
      # custom domain is wired up — base-href must match that subpath, or
      # assets/JS/routing break. Switch back to "/" (and restore CNAME) once
      # serwisnatury.pl DNS points here.
      - run: npx ng build --base-href /serwisnatury-web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/serwisnatury/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
